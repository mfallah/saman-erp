# =============================================================================
# Saman ERP — single-host Docker Compose stack (production baseline)
# -----------------------------------------------------------------------------
# Quick start (see docs/06-deployment/INSTALL-FA.md):
#   ./scripts/gen-secrets.sh        # creates .env + ./secrets/* (mode 400)
#   edit .env (DOMAIN/ACME_EMAIL/LIMO/CAREXY keys...)
#   docker compose up -d --build
#   docker compose --profile tools run --rm migrate
#   docker compose --profile tools run --rm migrate pnpm db:seed
#   docker compose --profile tls up -d caddy            # public HTTPS
#   docker compose --profile backup up -d backup        # nightly backups
#   docker compose --profile observability up -d prometheus grafana   # optional
#
# Production hardening/TLS: add `-f docker-compose.prod.yml` (see Makefile `up-prod`).
# Local development: `-f docker-compose.dev.yml` (see Makefile `up-dev`).
#
# Invariants (docs/06-deployment/DEPLOYMENT.md §3):
#  - no public port for postgres/redis/minio/api; web binds WEB_BIND_ADDR (default loopback)
#  - crown secrets are files under ./secrets, mounted via compose `secrets` and
#    consumed through *_FILE env indirection (never via env_file / image / git)
#  - app containers run read-only, user 1000:1000, no-new-privileges, cap_drop ALL
#  - migrations/seed are explicit one-shot `tools` runs, never on API boot
#  - resource limits use top-level cpus/mem_limit (Compose v2 ignores deploy.* outside swarm)
# =============================================================================

name: saman-erp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Shared runtime hardening for the two application processes.
x-app-runtime: &app-runtime
  env_file:
    - .env
  restart: unless-stopped
  init: true
  read_only: true
  user: "1000:1000"
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging: *default-logging
  networks:
    - backend
  # Crown secrets: mounted as files; backend reads *_FILE indirection.
  secrets:
    - jwt_access_secret
    - app_encryption_key
    - otp_pepper
    - refresh_pepper
    - db_password
    - redis_password

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — database `saman`, schema `erp`, roles created by init SQL.
  # Only reachable on the internal `backend` network.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saman}
      POSTGRES_DB: ${POSTGRES_DB:-saman}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: Asia/Tehran
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/docker/postgres/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
      - ./infra/docker/postgres/init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - backend
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 512m

  # ---------------------------------------------------------------------------
  # Redis 7 — cache, BullMQ queues, rate limits.
  # Password comes from the mounted secret; compose still fails fast elsewhere
  # if the file is missing (secret file is required by `docker compose up`).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - >-
        pw="$$(cat /run/secrets/redis_password 2>/dev/null || printf '%s' "$$REDIS_PASSWORD")";
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 768mb
        --maxmemory-policy noeviction
        --requirepass "$$pw"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: Asia/Tehran
    secrets:
      - redis_password
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pw="$$(cat /run/secrets/redis_password 2>/dev/null || printf '%s' "$$REDIS_PASSWORD")";
          redis-cli -a "$$pw" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - backend
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 128m

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (media/labels/exports + backups).
  # No healthcheck: the MinIO image has no guaranteed probe binary; readiness is
  # enforced by `minio-init` retrying until the server answers, and api/worker
  # depend on minio-init completing successfully.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER: "on"
      TZ: Asia/Tehran
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:9001:9001"
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - backend
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 256m

  # ---------------------------------------------------------------------------
  # One-shot bootstrap: buckets (`saman-files`, `saman-backups`), versioning and
  # the least-privilege application user. Retries MinIO readiness with backoff.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "/opt/minio-init.sh"]
    env_file:
      - .env
    environment:
      MC_CONFIG_DIR: /tmp/mc
      BACKUP_BUCKET: saman-backups
      TZ: Asia/Tehran
    volumes:
      - ./infra/docker/minio-init.sh:/opt/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    logging: *default-logging
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # API — NestJS/Fastify, stateless, internal port 4000 only.
  # ---------------------------------------------------------------------------
  api:
    <<: *app-runtime
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: prod
    image: saman-erp/api:${IMAGE_TAG:-1.0.0}
    command: ["node", "dist/main.js"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: "4000"
      NODE_ENV: production
      OTEL_SERVICE_NAME: saman-api
      TZ: Asia/Tehran
      # Crown secrets are files; backend supports *_FILE indirection (Lead R1-C H-11).
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      OTP_PEPPER_FILE: /run/secrets/otp_pepper
      REFRESH_PEPPER_FILE: /run/secrets/refresh_pepper
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    stop_grace_period: 30s
    cpus: "2.0"
    mem_limit: 1g
    mem_reservation: 256m

  # ---------------------------------------------------------------------------
  # Worker — same image, outbox dispatcher + BullMQ queues + scheduled jobs.
  # Scale with `--scale worker=N`; no fixed container_name.
  # ---------------------------------------------------------------------------
  worker:
    <<: *app-runtime
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: prod
    image: saman-erp/api:${IMAGE_TAG:-1.0.0}
    command: ["node", "dist/worker.js"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      OTEL_SERVICE_NAME: saman-worker
      TZ: Asia/Tehran
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      OTP_PEPPER_FILE: /run/secrets/otp_pepper
      REFRESH_PEPPER_FILE: /run/secrets/refresh_pepper
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Process-level check only; real liveness is the outbox-lag alert
    # (docs/07-operations/RUNBOOK.md §3.2).
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    cpus: "2.0"
    mem_limit: 1g
    mem_reservation: 256m

  # ---------------------------------------------------------------------------
  # Web — unprivileged nginx (non-root uid 101) serving the SPA and proxying
  # /api + /health to api:4000. WEB_BIND_ADDR=127.0.0.1 by default; set
  # 0.0.0.0 ONLY when a host nginx on a private interface must reach it.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: prod
    image: saman-erp/web:${IMAGE_TAG:-1.0.0}
    ports:
      - "${WEB_BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT:-8080}:8080"
    environment:
      TZ: Asia/Tehran
    user: "101:101"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    logging: *default-logging
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    cpus: "0.5"
    mem_limit: 128m
    mem_reservation: 32m

  # ---------------------------------------------------------------------------
  # One-shot release steps (explicit, never on API boot — ADR-0012).
  #   docker compose --profile tools run --rm migrate
  #   docker compose --profile tools run --rm migrate pnpm db:seed
  # Reads the DDL URL from the mounted `migration_db_url` secret.
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: prod
    image: saman-erp/api:${IMAGE_TAG:-1.0.0}
    # Migrations live in @saman/db; run its compiled runner (DDL role via MIGRATION_DATABASE_URL_FILE).
    working_dir: /app
    command: ["node", "/app/packages/db/dist/migrate.js"]
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: production
      TZ: Asia/Tehran
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_db_url
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      HOME: /tmp
    secrets:
      - migration_db_url
      - db_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    init: true
    read_only: false
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    logging: *default-logging
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Caddy — automatic HTTPS reverse proxy (profile `tls`).
  # Only this service publishes 80/443; it proxies to web:8080.
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["tls"]
    image: caddy:2.8.4-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required for the tls profile}
      ACME_EMAIL: ${ACME_EMAIL:-admin@carexy.shop}
      TZ: Asia/Tehran
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/nginx/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - edge
    cpus: "0.5"
    mem_limit: 128m

  # ---------------------------------------------------------------------------
  # Backup sidecar (profile `backup`): nightly `pg_dump -Fc` + sha256 + GPG,
  # upload to MinIO `saman-backups`, retention, optional offsite mirror.
  # Non-root (uid 1000, same as app/tools so mounted secrets are readable); only /backups (volume) and /tmp are writable.
  # ---------------------------------------------------------------------------
  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    image: saman-erp/backup:${IMAGE_TAG:-1.0.0}
    env_file:
      - .env
    environment:
      TZ: Asia/Tehran
      MC_CONFIG_DIR: /tmp/mc
      GNUPGHOME: /tmp/gnupg
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_db_url
      BACKUP_ENCRYPTION_PASSPHRASE_FILE: /run/secrets/backup_encryption_passphrase
    secrets:
      - migration_db_url
      - backup_encryption_passphrase
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name '.last-success' -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 5m
    cpus: "1.0"
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # Optional observability profile (external-facing is intentionally internal):
  # Prometheus scrapes api:4000/metrics; Grafana is bound to loopback only.
  # Config: infra/observability/. Mount it here or run them on another host.
  # ---------------------------------------------------------------------------
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.53.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - backend
    cpus: "0.5"
    mem_limit: 512m

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required for the observability profile}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    init: true
    logging: *default-logging
    networks:
      - backend
    cpus: "0.5"
    mem_limit: 256m

# -----------------------------------------------------------------------------
# Crown secrets: files generated by scripts/gen-secrets.sh under ./secrets/
# (git-ignored, mode 0400, owner uid 1000:1000). Never use `.env` for these in
# production; `_FILE` env vars point at /run/secrets/<name> inside containers.
# -----------------------------------------------------------------------------
secrets:
  jwt_access_secret:
    file: ./secrets/jwt_access_secret
  app_encryption_key:
    file: ./secrets/app_encryption_key
  otp_pepper:
    file: ./secrets/otp_pepper
  refresh_pepper:
    file: ./secrets/refresh_pepper
  db_password:
    file: ./secrets/db_password
  migration_db_url:
    file: ./secrets/migration_db_url
  redis_password:
    file: ./secrets/redis_password
  backup_encryption_passphrase:
    file: ./secrets/backup_encryption_passphrase

volumes:
  pgdata:
  redisdata:
  minio_data:
  caddy_data:
  caddy_config:
  pgbackups:
  prom_data:
  grafana_data:

networks:
  # Edge: TLS terminator <-> web only.
  edge:
    driver: bridge
  # Backend: application/data plane. Not `internal: true` because worker/api
  # need egress to channel APIs, Limo SMS and offsite S3 (DEPLOYMENT §5);
  # no service on this network publishes a public port.
  backend:
    driver: bridge
