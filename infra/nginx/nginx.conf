# =============================================================================
# Saman ERP — nginx main config for the unprivileged web image
# Runs as non-root (uid 101, image nginxinc/nginx-unprivileged), listens :8080.
# All writable paths are redirected to /tmp (compose mounts a tmpfs there).
# =============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable temp paths for the non-root user.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Structured access log (one JSON object per line) on stdout.
    log_format json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
      '"referer":"$http_referer","user_agent":"$http_user_agent",'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"request_id":"$http_x_request_id"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Uploads: documents, product images, label PDFs (app also enforces limits).
    client_max_body_size 25m;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xhtml+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Docker's embedded DNS; variable proxy_pass re-resolves `api` after restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
