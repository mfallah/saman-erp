# =============================================================================
# Saman ERP — web server (SPA + /api reverse proxy), served from :8080
# Internal upstreams:
#   /api/*     -> api:4000
#   /health/*  -> api:4000 (live/ready only; version/metrics stay internal)
#   /healthz   -> static 200 (container healthcheck)
# TLS is terminated by Caddy (profile tls) or the customer's host nginx.
# A variable proxy_pass + Docker DNS resolver re-resolves `api` after restarts.
# =============================================================================
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # --- Security headers (TLS/HSTS added by the TLS terminator) -------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Container liveness (static, does not touch the API) ----------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API proxy: exact health endpoints ----------------------------------
    location = /health/live {
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream/health/live;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location = /health/ready {
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream/health/ready;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # --- API proxy: everything under /api/ --------------------------------
    location /api/ {
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Idempotency/versioning headers must pass through untouched.
        proxy_pass_request_headers on;
    }

    # Metrics are internal-only (Prometheus scrapes api:4000 directly).
    location = /metrics {
        return 404;
    }

    # --- Static assets: long cache with content hashes ---------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # --- SPA history fallback (TanStack Router) ----------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve dotfiles / source maps from the image.
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(map|ts)$ {
        deny all;
    }
}
