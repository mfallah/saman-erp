# PostgreSQL 16 user name mapping — Saman ERP
# Mounted at /etc/postgresql/pg_ident.conf (referenced by postgresql.conf).
# No OS-level user mapping is required: authentication uses scram-sha-256 and
# `local` connections are trusted only inside this single-tenant database
# container (the socket is not exposed outside the container filesystem).
# Format: MAPNAME  SYSTEM-USERNAME  PG-USERNAME
