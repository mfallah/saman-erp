# PostgreSQL 16 client authentication — Saman ERP
# Mounted at /etc/postgresql/pg_hba.conf (referenced explicitly by postgresql.conf).
# The database is reachable only on the private Docker `backend` network; there
# is no published port. TLS for external PostgreSQL is a separate topology
# (INSTALL-FA §9.2) and is not configured inside this container.
#
# TYPE  DATABASE  USER            ADDRESS         METHOD
local   all       all                             trust
host    all       all             127.0.0.1/32    scram-sha-256
host    all       all             ::1/128         scram-sha-256
host    all       all             0.0.0.0/0       scram-sha-256
host    all       all             ::/0            scram-sha-256
