# =============================================================================
# Saman ERP — PostgreSQL 16 tuning (mounted at /etc/postgresql/postgresql.conf)
# Loaded via: postgres -c config_file=/etc/postgresql/postgresql.conf
# Sizing assumption: 8 vCPU / 16 GB host (ARCHITECTURE.md §11; DEPLOYMENT.md §15)
# For a 4 vCPU / 8 GB host use shared_buffers=1GB, effective_cache_size=3GB
# (these values are already conservative); ownership: Platform team.
# =============================================================================

# --- Connection / network ----------------------------------------------------
listen_addresses = '*'
port = 5432
# Config lives outside PGDATA, so point hba/ident explicitly at the mounted files
# (requires infra/docker/postgres/pg_hba.conf + pg_ident.conf to be mounted).
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'
max_connections = 200
superuser_reserved_connections = 5
unix_socket_directories = '/var/run/postgresql'
password_encryption = scram-sha-256
# TLS is terminated/terminated-in-front in the supported topologies:
#  - Option A (compose): private Docker network, no host port published.
#  - Option B (external/managed): TLS is enabled by the DB owner (INSTALL-FA §9.2).
ssl = off

# --- Memory ------------------------------------------------------------------
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_buffers = 16MB
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2

# --- WAL / checkpoints / planner --------------------------------------------
wal_level = replica
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 512MB
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Autovacuum (hot tables are additionally tuned per-table by migrations) --
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_cost_delay = 2ms

# --- Observability / slow queries -------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
log_min_duration_statement = 200ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
deadlock_timeout = 1s
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
log_destination = 'stderr'
logging_collector = off

# --- Safety nets (application-level timeouts live in the app/roles) ---------
statement_timeout = 0
lock_timeout = 10s
idle_in_transaction_session_timeout = 120s
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# --- Locale (all timestamps stored as UTC; Jalali conversion happens in app) -
datestyle = 'iso, mdy'
lc_messages = 'C'
