# =============================================================================
# Grafana provisioning — dashboard providers
# Mount at /etc/grafana/provisioning/dashboards/
# =============================================================================
apiVersion: 1

providers:
  - name: Saman ERP
    orgId: 1
    folder: "Saman ERP"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
