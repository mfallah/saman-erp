# =============================================================================
# Saman ERP — Prometheus scrape configuration (external/optional)
# The compose stack does not run Prometheus (service list is fixed, see
# docker-compose.yml). Run Prometheus on the host or another internal host and
# mount this file. Metrics endpoint is internal-only: api:4000/metrics.
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: saman-erp
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: saman-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: saman-api

  # Optional host/service exporters. Enable and add the matching services or
  # host-level exporters before uncommenting.
  # - job_name: node
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Blackbox probe for public TLS/health (run blackbox-exporter on the host).
  # - job_name: saman-blackbox
  #   metrics_path: /probe
  #   params:
  #     module: [http_2xx]
  #   static_configs:
  #     - targets: ["https://erp.carexy.shop/health/ready"]
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: blackbox-exporter:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
