# =============================================================================
# Saman ERP — CI (quality, integration, docker build matrix, compose validation)
# Required status checks for merging to main (see .github/workflows/README.md):
#   quality, integration, docker (api), docker (web), docker (backup), compose-config
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.18.0"
  PNPM_VERSION: "11.6.0"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (with coverage)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/api/dist
            apps/web/dist
            packages/shared/dist
            coverage
            **/junit.xml

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
    env:
      APP_ENV: test
      NODE_ENV: test
      APP_PORT: "4000"
      # CI-only superuser URLs: ephemeral DB, never production credentials.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/saman
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/saman
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_PASSWORD: ""
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      APP_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlLWtleS1mb3ItdGVzdHM=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: saman-files
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      SMS_MODE: mock
      DOCS_ENABLED: "false"
      BOOTSTRAP_ADMIN_MOBILE: "09120000000"
      BOOTSTRAP_ADMIN_PASSWORD: "ci-only-bootstrap-password"
      BOOTSTRAP_ORG_NAME: "Saman CI"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready"; exit 1

      - name: Create test object-storage bucket
        run: |
          docker run --rm --network host --entrypoint sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z -c '
              mc alias set local http://127.0.0.1:9000 minioadmin minioadmin >/dev/null &&
              mc mb --ignore-existing local/saman-files'
      - name: Migrate test database
        run: pnpm db:migrate
      - name: Seed test database
        run: pnpm db:seed
      - name: Integration tests
        run: pnpm test:int
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/junit.xml
            **/coverage

  docker:
    name: docker (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: infra/docker/api.Dockerfile
            target: prod
          - component: web
            dockerfile: infra/docker/web.Dockerfile
            target: prod
          - component: backup
            dockerfile: infra/backup/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            VITE_APP_VERSION=${{ github.ref_name }}

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate a parseable .env (dummy secrets; never used to deploy)
        run: |
          cp .env.example .env
          chmod 600 .env
          bash scripts/gen-secrets.sh --force
      - name: Validate compose base + overlays (semantic, needs Docker engine)
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          echo "compose files are semantically valid"
      - name: Validate repository config syntax (install-free)
        run: python3 scripts/validate-config.py
      - name: Upload generated compose config for review
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tls --profile backup config > compose-rendered.yml
      - uses: actions/upload-artifact@v4
        with:
          name: compose-rendered
          path: compose-rendered.yml
          retention-days: 7
