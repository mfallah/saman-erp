# =============================================================================
# Saman ERP — release workflow (tags v*)
# Builds and pushes the api/web/backup images to GHCR, then creates a GitHub
# release with the compose files and .env template as downloadable assets.
# No secrets are baked into images; config still comes from the customer .env.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: build-push (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: infra/docker/api.Dockerfile
            target: prod
          - component: web
            dockerfile: infra/docker/web.Dockerfile
            target: prod
          - component: backup
            dockerfile: infra/backup/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 images)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/saman-erp-${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release with deployment assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            docker-compose.prod.yml
            docker-compose.dev.yml
            .env.example
            Makefile
          body: |
            Saman ERP ${{ github.ref_name }}

            Deployment assets are attached. Install with the Persian guide:
            `docs/06-deployment/INSTALL-FA.md` (Persian) / `docs/06-deployment/DEPLOYMENT.md` (English).

            Images (set `IMAGE_TAG=${{ github.ref_name }}`):
            - `${{ env.REGISTRY }}/${{ github.repository_owner }}/saman-erp-api:${{ github.ref_name }}`
            - `${{ env.REGISTRY }}/${{ github.repository_owner }}/saman-erp-web:${{ github.ref_name }}`
            - `${{ env.REGISTRY }}/${{ github.repository_owner }}/saman-erp-backup:${{ github.ref_name }}`
